<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Репертуар Lera Rawlick</title>
<meta name="theme-color" content="#0E0D0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Репертуар">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500&display=swap">
<style>
/* Тёмная тема по просьбе Леры. Цвета — из брендбука монтажа (фон, текст, оранжевый акцент).
   На компьютере — колонка шириной с телефон, на телефоне — во весь экран. */
:root{
  --page:#060505;--bg:#0E0D0C;--card:#181614;--card2:#24211d;--line:#2c2824;
  --fg:#F6F1EA;--soft:#d9d1c6;--muted:#a39b91;--faint:#716a61;
  --accent:#FFA22B;--accent-soft:#3a2a14;--accent-ink:#1a1206;--accent-tr:#c99a5c;
  --know:#9cc77f;--new:#ff4f4a;--danger:#ff7a6b;
  --display:'Playfair Display',Georgia,'Times New Roman',serif;
  --body:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--page);color:var(--fg);font:15px/1.5 var(--body);font-variant-numeric:lining-nums;display:flex;align-items:center;justify-content:center;padding-block:20px;-webkit-text-size-adjust:100%}
.app{width:390px;max-width:100%;height:min(820px,100%);background:var(--bg);border:1px solid var(--line);border-radius:44px;overflow:hidden;display:flex;flex-direction:column;position:relative}
@media (max-width:500px){body{padding-block:0}.app{width:100%;height:100%;border:0;border-radius:0}}
.view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:calc(22px + env(safe-area-inset-top,0px));padding-bottom:28px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1{font:500 30px/1.15 var(--display);margin:0;text-wrap:balance}
h2{font:500 20px/1.2 var(--display);margin:24px 0 8px}
.eyebrow{font:600 11px var(--body);letter-spacing:.16em;color:var(--faint);text-transform:uppercase}
.sub{color:var(--muted);font-size:13px;margin:6px 0 0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;font:600 15px var(--body);padding:14px;text-decoration:none}
.sbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:500 13px var(--body);color:var(--fg);text-decoration:none}
.sbtn.danger{color:var(--danger)}
.row2{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tile{aspect-ratio:1;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.tile .tt{font:500 22px/1.2 var(--display)}
.tl{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:7px 0;font-size:13px;text-align:left}
.tl span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.card-link{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left}
.card-link small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;background:none;border:0;color:var(--muted);font:500 13px var(--body);padding:8px 4px;border-radius:9px}
.seg button.on{background:var(--card2);color:var(--fg)}
.seg button.on.know{color:var(--know)} .seg button.on.new{color:var(--new)}
.search{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--fg);font:inherit;font-size:16px;padding:10px 12px;margin-top:10px}
.letter{font:600 12px var(--body);color:var(--accent);margin:16px 0 2px;letter-spacing:.08em}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row .t{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.a{font-size:12px;color:var(--muted)}
.chip{font:500 12px var(--body);color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:3px 8px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;flex:none;border:1px solid var(--faint)}
.dot.know{background:var(--know);border-color:var(--know)} .dot.new{background:var(--new);border-color:var(--new)}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.crow{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.crow:first-of-type{border-top:0}
.num{font:500 13px var(--body);color:var(--faint);width:20px;text-align:right;font-variant-numeric:tabular-nums}
.lbl{font:600 11px var(--body);color:var(--faint);letter-spacing:.1em;text-transform:uppercase}
.back{background:none;border:0;color:var(--muted);font:500 14px var(--body);display:flex;align-items:center;gap:2px;padding:0}
.title{font:500 28px/1.15 var(--display);margin:14px 0 4px;text-wrap:balance}
.about{font-size:14px;line-height:1.6;color:var(--soft);margin:12px 0 0}
details.notes{margin:10px 0 0;font-size:13px;color:var(--muted)}
details.notes summary{cursor:pointer;color:var(--muted);font-weight:500}
details.notes div{white-space:pre-wrap;line-height:1.55;margin-top:8px;color:var(--soft)}
.keys{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;margin-top:14px}
.kv{font:500 22px var(--body);margin-top:2px;font-variant-numeric:tabular-nums}
.kv.acc{color:var(--accent)} .kv.small{font-size:17px}
.who{font:400 12px var(--body);color:var(--muted);margin-left:6px}
.hint{font-size:12px;color:var(--muted);margin:8px 2px 0}
.hint b{color:var(--accent);font-weight:500}
.links{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.lk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px;color:var(--fg);text-decoration:none;font:500 13px var(--body);display:flex;flex-direction:column;align-items:center;gap:6px}
.lk.mine{border-color:var(--accent);color:var(--accent)}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0;padding-top:0}
.mname{flex:1;min-width:0;font-size:13px}
.mname span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.play{width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:0;display:grid;place-items:center;flex:none}
.ghost{width:42px;height:42px;border-radius:50%;background:var(--card2);border:0;display:grid;place-items:center;flex:none;color:var(--fg);text-decoration:none}
.bar{height:6px;background:var(--card2);border-radius:3px;overflow:hidden;margin-top:6px;cursor:pointer}.bar i{display:block;height:100%;width:0;background:var(--accent)}
.time{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;margin-top:3px}
.lyh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:24px 0 12px}
.sws{display:flex;gap:14px;align-items:center}
.sw{display:flex;align-items:center;gap:8px;background:none;border:0;color:var(--muted);font:500 13px var(--body);padding:0}
.sw i{width:34px;height:20px;border-radius:10px;background:var(--card2);position:relative;transition:background .2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:transform .2s}
.sw.on{color:var(--fg)} .sw.on i{background:var(--accent)} .sw.on i::after{transform:translateX(14px);background:var(--accent-ink)}
.stanza{margin:0 0 20px;cursor:pointer}
.stanza .lbl{margin-bottom:4px}
.ln{margin:0;font-size:16px;line-height:1.55;overflow-wrap:anywhere}
.cue{margin:2px 0;font-size:12px;line-height:1.4;color:var(--faint);font-style:italic}
.tr,.or{display:block;font-size:13px;line-height:1.45;color:var(--muted);margin:0 0 6px;overflow-wrap:anywhere}
.tr{font-style:italic}
.or{color:var(--soft);opacity:.85}
.blk{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.pr{font-size:11px;color:var(--faint);margin:0 3px}
.chorus{border-left:3px solid var(--accent);border-radius:0;padding-left:12px}
.chorus .lbl{color:var(--accent)}
.chorus .ln{color:var(--accent);font-weight:500;font-size:17px}
.chorus .tr{color:var(--accent-tr)}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.pn button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;font-size:13px;min-width:0}
.pn small{display:block;color:var(--faint);font-size:11px}
.pn span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.f label,.flbl{font:500 12px var(--body);color:var(--muted)}
.f input,.f textarea,.f select{background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--fg);font:inherit;font-size:16px;padding:10px 12px;width:100%}
.f textarea{min-height:110px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--danger);font-size:13px}
.ok{color:var(--know)}
.steps{margin:8px 0 0;padding-left:18px;color:var(--soft);font-size:14px;line-height:1.6}
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--bg);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tb{background:none;border:0;color:var(--faint);font:500 11px var(--body);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0}
.tb.on{color:var(--accent)}
.tb svg{width:22px;height:22px}
.toast{position:absolute;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13px;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:none}
.empty{color:var(--muted);font-size:14px;line-height:1.6;margin:20px 0 0}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <main class="view" id="view"><p class="empty">Загружаю…</p></main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <nav class="tabbar" id="tabbar" aria-label="Разделы"></nav>
</div>
<script src="songs.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
